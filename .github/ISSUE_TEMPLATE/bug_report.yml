name: Bug report
description: Report behavior that is not working as expected.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Thank you for helping improve BhoomiSetu. Do not include credentials or sensitive land records."
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Clearly describe the problem and its impact.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      placeholder: "1. …\n2. …\n3. …"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
